
<section class="auth-section py-5">
  <div class="container">
    <div class="flip-container" [class.flip]="!isLoginMode">
      <div class="flipper">

        <!-- Login Card -->
        <div class="auth-card front mx-auto p-4 shadow rounded">
          <h2 class="text-center mb-4">🔑 Login to Homify</h2>
          <form [formGroup]="authForm" (ngSubmit)="onSubmit()">

            <!-- Email -->
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="Your Email">
              <div class="text-danger" *ngIf="authForm.get('email')?.touched && authForm.get('email')?.invalid">
                Please enter a valid email.
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label>Password</label>
              <input type="password" class="form-control" formControlName="password" placeholder="Password">
              <div class="text-danger" *ngIf="authForm.get('password')?.touched && authForm.get('password')?.invalid">
                Minimum 6 characters required.
              </div>
            </div>

            <!-- Remember Me -->
            <div class="mb-3">
              <label>
                <input type="checkbox" formControlName="rememberMe" title="Remember me">
                Remember me
              </label>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-primary w-100" type="submit" [disabled]="authForm.invalid">
              Login
            </button>

            <!-- Switch Mode -->
            <p class="mt-3 text-center small">
              Don’t have an account?
              <a href="#" (click)="toggleMode($event)" class="text-primary fw-bold">Sign Up</a>
            </p>
          </form>
        </div>

        <!-- Signup Card -->
        <div class="auth-card back mx-auto p-4 shadow rounded">
          <h2 class="text-center mb-4">📝 Sign Up for Homify</h2>
          <form [formGroup]="authForm" (ngSubmit)="onSubmit()">

            <!-- Name -->
            <div class="mb-3">
              <label>Name</label>
              <input type="text" class="form-control" formControlName="name" placeholder="Your Name">
              <div class="text-danger" *ngIf="authForm.get('name')?.touched && authForm.get('name')?.invalid">
                Name is required (max 30 characters).
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="Your Email">
              <div class="text-danger" *ngIf="authForm.get('email')?.touched && authForm.get('email')?.invalid">
                Please enter a valid email.
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label>Password</label>
              <input type="password" class="form-control" formControlName="password" placeholder="Password">
              <div class="text-danger" *ngIf="authForm.get('password')?.touched && authForm.get('password')?.invalid">
                Minimum 6 characters required.
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label>Confirm Password</label>
              <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm Password">
              <div class="text-danger" *ngIf="authForm.get('confirmPassword')?.errors?.['mismatch']">
                Passwords do not match.
              </div>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-primary w-100" type="submit" [disabled]="authForm.invalid">
              Sign Up
            </button>

            <!-- Switch Mode -->
            <p class="mt-3 text-center small">
              Already have an account?
              <a href="#" (click)="toggleMode($event)" class="text-primary fw-bold">Login</a>
            </p>
            
          </form>
        </div>

      </div>
    </div>
  </div>
</section>
