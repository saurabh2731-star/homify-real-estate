<section class="contact-section py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center g-5">
      <!-- Contact Form Column -->
      <div class="col-lg-6 shadow rounded-4 p-5 bg-white">
        <h2 class="mb-4 text-center">📞 Get In Touch</h2>
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" formControlName="name" id="name" class="form-control" placeholder="Your name">
            <div class="text-danger" *ngIf="submitted && contactForm.get('name')?.invalid">
              Name is required.
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" formControlName="email" id="email" class="form-control" placeholder="you@example.com">
            <div class="text-danger" *ngIf="submitted && contactForm.get('email')?.invalid">
              <div *ngIf="contactForm.get('email')?.errors?.['required']">Email is required.</div>
              <div *ngIf="contactForm.get('email')?.errors?.['email']">Email format is invalid.</div>
            </div>
          </div>

          <div class="mb-4">
            <label for="message" class="form-label">Your Message</label>
            <textarea formControlName="message" id="message" rows="5" class="form-control" placeholder="Type your message..."></textarea>
            <div class="text-danger" *ngIf="submitted && contactForm.get('message')?.invalid">
              Message is required.
            </div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-dark px-5">Send Message</button>
          </div>
        </form>
      </div>

      <!-- Company Info Column -->
      <div class="col-lg-5 text-center text-lg-start">
        <h3 class="mb-4">🏢 Homify – Luxury Homes</h3>
        <p class="mb-3"><strong>📍 Address:</strong><br> 123 Villa Lane, Beverly Hills, CA</p>
        <p class="mb-3"><strong>📧 Email:</strong><br> support&#64;homifylux.com</p>
        <p class="mb-3"><strong>📞 Phone:</strong><br> +1 800 123 4567</p>
        <p class="text-muted">We typically respond within 24 hours.</p>
      </div>
    </div>
  </div>
</section>
