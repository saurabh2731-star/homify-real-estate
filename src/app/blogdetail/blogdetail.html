<section class="detail-section py-5" *ngIf="post">
  <div class="container">
    <a routerLink="/blog-lifestyle" class="back-link">← Back to Blogs</a>
    <div class="detail-card mt-4 shadow-sm rounded-4 p-4">
      <img [src]="post.image" [alt]="post.title" class="detail-img mb-4">
      <h2 class="mb-3">{{ post.title }}</h2>
      <span class="category-tag">{{ post.category }}</span>
      <div class="detail-content mt-3" [innerHTML]="post.content"></div>
    </div>
  </div>
</section>
