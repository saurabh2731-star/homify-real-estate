<div class="container my-5">
  <h2 class="text-center mb-4">🏢 Available Penthouses</h2>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let penthouse of penthouses">
      <div class="card h-100 shadow penthouse-card">

        <div class="position-relative"> 
              <!-- Penthouse Image -->
        <img [src]="penthouse.image" class="card-img-top" [alt]="penthouse.name" loading="lazy">

        <!-- Favorite Toggle Buttons -->
           <!-- Favorite Button Toggle -->
          <button class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow"
                  (click)="addToFavorites(penthouse)" *ngIf="!isFavorite(penthouse.id)" title="Add to Favorites">
            <i class="bi bi-heart"></i>
          </button>
          <button class="btn btn-danger position-absolute top-0 end-0 m-2 rounded-circle shadow"
                  (click)="removeFromFavorites(penthouse.id)" *ngIf="isFavorite(penthouse.id)" title="Remove from Favorites">
            <i class="bi bi-heart-fill"></i>
          </button>
        </div>

        <!-- Card Content --> 
        <div class="card-body">
          <h5 class="card-title">{{ penthouse.name }}</h5>
          <p class="text-muted">{{ penthouse.location }}</p>
          <p class="fw-bold">₹ {{ penthouse.price }}</p>
             <a [routerLink]="['/penthousedetails', penthouse.id]" class="btn btn-outline-primary">View Details</a>
        </div>
      </div>
    </div>
  </div>
</div>
